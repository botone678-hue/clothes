name: Fix admin actions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'finalize admin schema fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final schema-safe fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/storage.ts')
          s = p.read_text()
          # notifications table uses recipient_id, never user_id
          s = s.replace('user_id:', 'recipient_id:')
          # Harden every visible currency formatter in customer-facing order code.
          c = Path('src/pages/CustomerOrders.tsx')
          if c.exists():
              cs = c.read_text()
              cs = cs.replace('order.total.toLocaleString()', 'Number(order.total ?? 0).toLocaleString()')
              cs = cs.replace('order.total?.toLocaleString()', 'Number(order.total ?? 0).toLocaleString()')
              c.write_text(cs)
          p.write_text(s)
          if 'user_id:' in s:
              raise SystemExit('storage.ts still contains notification user_id')
          if 'order.total.toLocaleString()' in c.read_text():
              raise SystemExit('CustomerOrders still contains unsafe total formatter')
      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/storage.ts src/pages/CustomerOrders.tsx
          git commit -m "finalize admin schema fixes" || exit 0
          git push origin main
