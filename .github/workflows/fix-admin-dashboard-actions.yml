name: Patch admin actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'admin action patch applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch action handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/admin/AdminDashboard.tsx')
          s=p.read_text()
          s=s.replace("const handleStatusChange = async (newStatus: OrderStatus) => { if (!selectedOrder) return; setIsUpdatingOrder(true); await db.updateOrderStatus(selectedOrder.id, newStatus, user?.id || 'admin', user?.full_name || 'Admin', `Status changed by Admin to ${newStatus}`); const updated = await db.getOrders(); setOrders(updated); const refreshed = updated.find((o) => o.id === selectedOrder.id); if (refreshed) setSelectedOrder(refreshed); setIsUpdatingOrder(false); };", "const handleStatusChange = async (newStatus: OrderStatus) => { if (!selectedOrder || isUpdatingOrder) return; setIsUpdatingOrder(true); try { await db.updateOrderStatus(selectedOrder.id, newStatus, user?.id || 'admin', user?.full_name || 'Admin', `Status changed by Admin to ${newStatus}`); await loadData(); const refreshed = (await db.getOrders()).find((o) => o.id === selectedOrder.id); if (refreshed) setSelectedOrder(refreshed); } catch (error) { console.error('Admin status update failed', error); window.alert(error instanceof Error ? error.message : String(error)); } finally { setIsUpdatingOrder(false); } };")
          s=s.replace("const handleCreateService = async (e: React.FormEvent) => { e.preventDefault(); await db.createService({ name: newServiceName, category: newServiceCategory, price_type: newServiceType, base_price: Number(newServicePrice), estimated_duration: newServiceDuration, description: newServiceDesc, image_url: 'https://images.unsplash.com/photo-1545173168-9f1947eebb7f?auto=format&fit=crop&w=800&q=80' }); setIsAddingService(false); setNewServiceName(''); setNewServiceDesc(''); onRefreshServices(); };", "const handleCreateService = async (e: React.FormEvent) => { e.preventDefault(); if (!newServiceName.trim() || isAddingService) return; try { setIsAddingService(true); await db.createService({ name: newServiceName.trim(), category: newServiceCategory, price_type: newServiceType, base_price: Number(newServicePrice), estimated_duration: newServiceDuration, description: newServiceDesc, image_url: 'https://images.unsplash.com/photo-1545173168-9f1947eebb7f?auto=format&fit=crop&w=800&q=80' }); setNewServiceName(''); setNewServiceDesc(''); await onRefreshServices(); } catch (error) { console.error('Admin service creation failed', error); window.alert(error instanceof Error ? error.message : String(error)); } finally { setIsAddingService(false); } };")
          p.write_text(s)
          PY
      - name: Patch storage errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/storage.ts')
          s=p.read_text()
          s=s.replace("await supabase\n          .from('orders')\n          .update({\n            status: newStatus,\n            updated_at: new Date().toISOString(),\n          })\n          .eq('id', orderId);", "const { error } = await supabase.from('orders').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', orderId); if (error) throw error;")
          s=s.replace("await supabase\n          .from('payments')\n          .update({\n            status,\n            transaction_reference: updatedPayment.transaction_reference,\n            paid_at: updatedPayment.paid_at,\n            updated_at: now,\n          })\n          .eq('order_id', orderId);", "const paymentUpdate = await supabase.from('payments').update({ status, transaction_reference: updatedPayment.transaction_reference, paid_at: updatedPayment.paid_at, updated_at: now }).eq('order_id', orderId); if (paymentUpdate.error) throw paymentUpdate.error;")
          s=s.replace("await supabase\n          .from('orders')\n          .update({\n            payment_status: status,\n            updated_at: now,\n          })\n          .eq('id', orderId);", "const orderPaymentUpdate = await supabase.from('orders').update({ payment_status: status, updated_at: now }).eq('id', orderId); if (orderPaymentUpdate.error) throw orderPaymentUpdate.error;")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminDashboard.tsx src/lib/storage.ts
          git diff --cached --quiet && exit 0
          git commit -m "admin action patch applied"
          git push origin main
