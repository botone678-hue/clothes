name: Fix admin UI actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'admin UI actions applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AdminDashboard and storage action wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/admin/AdminDashboard.tsx')
          s = p.read_text()
          replacements = {
            "const handleAssignDriver = async (driverId: string) => { if (!selectedOrder) return; const driver = drivers.find((d) => d.id === driverId); if (!driver) return; setIsUpdatingOrder(true); await db.assignDriver(selectedOrder.id, driver.id, driver.full_name || driver.name || 'Driver', driver.phone); const updated = await db.getOrders(); setOrders(updated); const refreshed = updated.find((o) => o.id === selectedOrder.id); if (refreshed) setSelectedOrder(refreshed); setIsUpdatingOrder(false); };":
            "const handleAssignDriver = async (driverId: string) => { if (!selectedOrder || isUpdatingOrder) return; const driver = drivers.find((d) => d.id === driverId); if (!driver) return; setIsUpdatingOrder(true); try { const result = await db.assignDriver(selectedOrder.id, driver.id, user?.full_name || 'Admin', driver.phone); if (!result) throw new Error('Driver assignment failed'); await loadData(); const refreshed = (await db.getOrders()).find((o) => o.id === selectedOrder.id); if (refreshed) setSelectedOrder(refreshed); } catch (error) { console.error('Admin driver assignment failed', error); window.alert(error instanceof Error ? error.message : String(error)); } finally { setIsUpdatingOrder(false); } };",
            "const handlePaymentToggle = async (newPaymentStatus: PaymentStatus) => { if (!selectedOrder) return; setIsUpdatingOrder(true); await db.updatePaymentStatus(selectedOrder.id, newPaymentStatus); const updated = await db.getOrders(); setOrders(updated); const refreshed = updated.find((o) => o.id === selectedOrder.id); if (refreshed) setSelectedOrder(refreshed); setIsUpdatingOrder(false); };":
            "const handlePaymentToggle = async (newPaymentStatus: PaymentStatus) => { if (!selectedOrder || isUpdatingOrder) return; setIsUpdatingOrder(true); try { await db.updatePaymentStatus(selectedOrder.id, newPaymentStatus); await loadData(); const refreshed = (await db.getOrders()).find((o) => o.id === selectedOrder.id); if (refreshed) setSelectedOrder(refreshed); } catch (error) { console.error('Admin payment update failed', error); window.alert(error instanceof Error ? error.message : String(error)); } finally { setIsUpdatingOrder(false); } };",
            "const handleDirectPaymentAction = async (orderId: string, newStatus: PaymentStatus) => { setIsUpdatingOrder(true); await db.updatePaymentStatus(orderId, newStatus); const updated = await db.getOrders(); setOrders(updated); if (selectedOrder?.id === orderId) { const refreshed = updated.find((o) => o.id === orderId); if (refreshed) setSelectedOrder(refreshed); } setIsUpdatingOrder(false); };":
            "const handleDirectPaymentAction = async (orderId: string, newStatus: PaymentStatus) => { if (isUpdatingOrder) return; setIsUpdatingOrder(true); try { await db.updatePaymentStatus(orderId, newStatus); await loadData(); if (selectedOrder?.id === orderId) { const refreshed = (await db.getOrders()).find((o) => o.id === orderId); if (refreshed) setSelectedOrder(refreshed); } } catch (error) { console.error('Admin direct payment action failed', error); window.alert(error instanceof Error ? error.message : String(error)); } finally { setIsUpdatingOrder(false); } };",
            "const handleCreateDriver = async (e: React.FormEvent) => { e.preventDefault(); await db.createDriver({ name: newDriverName, phone: newDriverPhone, vehicle_type: newDriverVehicle, zone: 'Hawaii Area & Eldoret' }); setIsAddingDriver(false); setNewDriverName(''); setNewDriverPhone(''); void loadData(); };":
            "const handleCreateDriver = async (e: React.FormEvent) => { e.preventDefault(); if (!newDriverName.trim() || !newDriverPhone.trim() || isAddingDriver) return; try { setIsAddingDriver(true); const saved = await db.createDriver({ name: newDriverName.trim(), phone: newDriverPhone.trim(), vehicle_type: newDriverVehicle.trim(), zone: 'Hawaii Area & Eldoret' }); if (!saved) throw new Error('Driver was not saved'); setNewDriverName(''); setNewDriverPhone(''); setIsAddingDriver(false); await loadData(); } catch (error) { console.error('Admin driver creation failed', error); window.alert(error instanceof Error ? error.message : String(error)); setIsAddingDriver(false); } };"
          }
          for old, new in replacements.items():
            if old not in s: raise SystemExit('required AdminDashboard handler not found')
            s = s.replace(old, new, 1)
          for old, new in [('ord.total.toLocaleString()', 'Number(ord.total ?? 0).toLocaleString()'), ('selectedOrder.total.toLocaleString()', 'Number(selectedOrder.total ?? 0).toLocaleString()'), ('selectedOrder.delivery_fee.toLocaleString()', 'Number(selectedOrder.delivery_fee ?? 0).toLocaleString()'), ('it.subtotal.toLocaleString()', 'Number(it.subtotal ?? 0).toLocaleString()')]: s = s.replace(old, new)
          p.write_text(s)
          p = Path('src/lib/storage.ts')
          s = re.sub(r'(?<![A-Za-z0-9_])user_id:\s*', 'recipient_id: ', p.read_text())
          p.write_text(s)
          PY
      - name: Commit patched dashboard and storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminDashboard.tsx src/lib/storage.ts
          git diff --cached --quiet && exit 0
          git commit -m "admin UI actions applied"
          git push origin main
