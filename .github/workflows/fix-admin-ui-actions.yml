name: Fix admin UI actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'admin UI actions applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AdminDashboard and storage action wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---- Admin UI ----
          p = Path('src/pages/admin/AdminDashboard.tsx')
          s = p.read_text()

          s = s.replace(
            'onClick={() => setSelectedOrder(ord)} className="px-3 py-1.5 bg-slate-900',
            'type="button" onClick={(e) => { e.preventDefault(); e.stopPropagation(); setSelectedOrder(ord); }} onPointerDown={(e) => { e.stopPropagation(); }} className="px-3 py-1.5 bg-slate-900'
          )
          s = s.replace(
            '<button onClick={() => setSelectedOrder(ord)} className="px-2.5 py-1.5 bg-slate-900',
            '<button type="button" onClick={(e) => { e.preventDefault(); e.stopPropagation(); setSelectedOrder(ord); }} onPointerDown={(e) => { e.stopPropagation(); }} className="px-2.5 py-1.5 bg-slate-900'
          )
          s = s.replace('<button onClick=', '<button type="button" onClick=')
          s = s.replace('<button disabled=', '<button type="button" disabled=')

          # ---- Storage: payment actions must work on a fresh admin device ----
          p = Path('src/lib/storage.ts')
          s = p.read_text()

          old = """  async updatePaymentStatus(\n    orderId: string,\n    status: PaymentStatus,\n    reference?: string,\n    providerResponse?: any\n  ): Promise<Payment | null> {\n    const payments = getLocal<Payment[]>(KEYS.PAYMENTS, []);\n    const idx = payments.findIndex((p) => p.order_id === orderId);\n    if (idx < 0) return null;\n"""
          new = """  async updatePaymentStatus(\n    orderId: string,\n    status: PaymentStatus,\n    reference?: string,\n    providerResponse?: any\n  ): Promise<Payment | null> {\n    // Always hydrate payments from Supabase first. The admin may be on a different\n    // phone/browser and therefore have no local payment cache.\n    const payments = await db.getPayments();\n    const idx = payments.findIndex((p) => p.order_id === orderId);\n    if (idx < 0) throw new Error(`Payment record not found for order ${orderId}`);\n"""
          if old not in s:
            raise SystemExit('payment block not found; refusing partial patch')
          s = s.replace(old, new, 1)

          # Do not silently swallow Supabase writes for services/profiles.
          old = """        await supabase.from('services').upsert(saved);\n      } catch (e) {\n        console.error('Supabase save service error', e);\n      }\n"""
          new = """        const { error } = await supabase.from('services').upsert(saved);\n        if (error) throw new Error(`Service save failed: ${error.message}`);\n      } catch (e) {\n        console.error('Supabase save service error', e);\n        throw e;\n      }\n"""
          if old not in s:
            raise SystemExit('service save block not found; refusing partial patch')
          s = s.replace(old, new, 1)

          old = """        await supabase.from('profiles').upsert(saved);\n      } catch (e) {\n        console.error('Supabase save profile error', e);\n      }\n"""
          new = """        const { error } = await supabase.from('profiles').upsert(saved);\n        if (error) throw new Error(`Driver profile save failed: ${error.message}`);\n      } catch (e) {\n        console.error('Supabase save profile error', e);\n        throw e;\n      }\n"""
          if old not in s:
            raise SystemExit('profile save block not found; refusing partial patch')
          s = s.replace(old, new, 1)

          # Ensure payment writes are never reported as successful when Supabase rejected them.
          old = """        const paymentUpdate = await supabase.from('payments').update({ status, transaction_reference: updatedPayment.transaction_reference, paid_at: updatedPayment.paid_at, updated_at: now }).eq('order_id', orderId); if (paymentUpdate.error) throw paymentUpdate.error;\n\n        const orderPaymentUpdate = await supabase.from('orders').update({ payment_status: status, updated_at: now }).eq('id', orderId); if (orderPaymentUpdate.error) throw orderPaymentUpdate.error;\n      } catch (e) {\n        console.error('Supabase update payment error', e);\n      }\n"""
          new = """        const paymentUpdate = await supabase.from('payments').update({ status, transaction_reference: updatedPayment.transaction_reference, paid_at: updatedPayment.paid_at, updated_at: now }).eq('order_id', orderId);\n        if (paymentUpdate.error) throw new Error(`Payment update failed: ${paymentUpdate.error.message}`);\n\n        const orderPaymentUpdate = await supabase.from('orders').update({ payment_status: status, updated_at: now }).eq('id', orderId);\n        if (orderPaymentUpdate.error) throw new Error(`Order payment status update failed: ${orderPaymentUpdate.error.message}`);\n      } catch (e) {\n        console.error('Supabase update payment error', e);\n        throw e;\n      }\n"""
          if old not in s:
            raise SystemExit('payment write block not found; refusing partial patch')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patched dashboard and storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminDashboard.tsx src/lib/storage.ts
          git diff --cached --quiet && exit 0
          git commit -m "admin UI actions applied"
          git push origin main
